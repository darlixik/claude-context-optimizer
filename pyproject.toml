[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-context-optimizer"
version = "0.1.0"
description = "Token budget tracking, smart context pruning, and prompt optimization for Claude API workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "David", email = "david@example.com"}
]
keywords = ["anthropic", "claude", "llm", "context-window", "token-optimization", "prompt-caching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[project.scripts]
claude-opt = "claude_optimizer.cli:main"

[project.urls]
"Homepage" = "https://github.com/your-username/claude-context-optimizer"
"Bug Tracker" = "https://github.com/your-username/claude-context-optimizer/issues"
